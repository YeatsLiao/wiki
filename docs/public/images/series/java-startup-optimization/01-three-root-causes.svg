<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 555" font-family="sans-serif">
  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#2C2C2A">Java 冷启动慢 = 三段叠加</text>

  <!-- Box 1: 框架复杂度爆炸 -->
  <rect x="30" y="45" width="620" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <circle cx="55" cy="72" r="13" fill="#185FA5"/>
  <text x="55" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">1</text>
  <text x="78" y="77" font-size="14" font-weight="500" fill="#2C2C2A">框架复杂度爆炸</text>
  <text x="50" y="108" font-size="13" fill="#5F5E5A">Spring Boot Hello Web</text>
  <rect x="195" y="98" width="220" height="14" rx="3" fill="#185FA5"/>
  <text x="425" y="110" font-size="12" font-weight="500" fill="#185FA5">7,404 class</text>
  <text x="50" y="132" font-size="13" fill="#5F5E5A">Node express</text>
  <rect x="195" y="122" width="8" height="14" rx="3" fill="#888780"/>
  <text x="212" y="134" font-size="12" font-weight="500" fill="#888780">55 files</text>
  <text x="50" y="158" font-size="12" fill="#888780">差了两个数量级</text>

  <!-- Plus -->
  <text x="340" y="193" text-anchor="middle" font-size="24" font-weight="600" fill="#888780">+</text>

  <!-- Box 2: WORA 动态类加载 -->
  <rect x="30" y="205" width="620" height="130" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <circle cx="55" cy="232" r="13" fill="#1D9E75"/>
  <text x="55" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">2</text>
  <text x="78" y="237" font-size="14" font-weight="500" fill="#2C2C2A">WORA 动态类加载</text>
  <rect x="50" y="258" width="94" height="24" rx="12" fill="#1D9E75" fill-opacity="0.15"/>
  <text x="97" y="274" text-anchor="middle" font-size="11" fill="#1D9E75">JAR 遍历</text>
  <text x="156" y="274" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="169" y="258" width="94" height="24" rx="12" fill="#1D9E75" fill-opacity="0.15"/>
  <text x="216" y="274" text-anchor="middle" font-size="11" fill="#1D9E75">查找 .class</text>
  <text x="275" y="274" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="288" y="258" width="94" height="24" rx="12" fill="#1D9E75" fill-opacity="0.15"/>
  <text x="335" y="274" text-anchor="middle" font-size="11" fill="#1D9E75">校验</text>
  <text x="394" y="274" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="407" y="258" width="94" height="24" rx="12" fill="#1D9E75" fill-opacity="0.15"/>
  <text x="454" y="274" text-anchor="middle" font-size="11" fill="#1D9E75">解析</text>
  <text x="513" y="274" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="526" y="258" width="94" height="24" rx="12" fill="#1D9E75" fill-opacity="0.15"/>
  <text x="573" y="274" text-anchor="middle" font-size="11" fill="#1D9E75">初始化</text>
  <text x="50" y="312" font-size="12" fill="#888780">首次使用时才加载，每次启动都重复一遍</text>

  <!-- Plus -->
  <text x="340" y="353" text-anchor="middle" font-size="24" font-weight="600" fill="#888780">+</text>

  <!-- Box 3: JIT 预热 -->
  <rect x="30" y="365" width="620" height="130" rx="8" fill="#FDF0EB" stroke="#D85A30" stroke-width="1.5"/>
  <circle cx="55" cy="392" r="13" fill="#D85A30"/>
  <text x="55" y="397" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">3</text>
  <text x="78" y="397" font-size="14" font-weight="500" fill="#2C2C2A">JIT 预热</text>
  <rect x="50" y="418" width="170" height="24" rx="12" fill="#D85A30" fill-opacity="0.15"/>
  <text x="135" y="434" text-anchor="middle" font-size="12" fill="#D85A30">解释执行</text>
  <text x="235" y="434" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="250" y="418" width="170" height="24" rx="12" fill="#D85A30" fill-opacity="0.15"/>
  <text x="335" y="434" text-anchor="middle" font-size="12" fill="#D85A30">C1（2000次）</text>
  <text x="435" y="434" text-anchor="middle" font-size="14" fill="#888780">→</text>
  <rect x="450" y="418" width="170" height="24" rx="12" fill="#D85A30" fill-opacity="0.15"/>
  <text x="535" y="434" text-anchor="middle" font-size="12" fill="#D85A30">C2（15000次）</text>
  <text x="50" y="472" font-size="12" fill="#888780">解释执行比 C2 慢 26~50 倍，启动阶段等于慢动作运行</text>

  <!-- Summary -->
  <text x="340" y="528" text-anchor="middle" font-size="13" font-weight="500" fill="#5F5E5A">不是 JVM 慢，是运行时才做本该编译期做的事</text>
</svg>
