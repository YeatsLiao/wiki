<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E24B4A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D85A30"/>
    </marker>
  </defs>

  <!-- 上部：正常流程 -->
  <rect x="20" y="10" width="640" height="200" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1D9E75">正常情况（未开启懒加载）</text>

  <!-- 流程节点 -->
  <rect x="30" y="55" width="100" height="36" rx="6" fill="#1D9E75"/>
  <text x="80" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">refresh()</text>

  <rect x="32" y="160" width="96" height="36" rx="6" fill="#1D9E75"/>
  <text x="80" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">连接建立</text>

  <rect x="180" y="55" width="110" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="235" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1D9E75">实例化MqttClientUtils</text>

  <rect x="340" y="55" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="390" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1D9E75">connect()</text>

  <rect x="490" y="55" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="540" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1D9E75">MQTT连接建立</text>

  <rect x="580" y="160" width="80" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="620" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1D9E75">正常接收消息</text>

  <!-- 箭头 -->
  <line x1="130" y1="73" x2="178" y2="73" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="290" y1="73" x2="338" y2="73" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="440" y1="73" x2="488" y2="73" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 向下箭头 refresh → 连接建立 -->
  <line x1="80" y1="91" x2="80" y2="158" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <rect x="85" y="116" width="100" height="24" rx="4" fill="#E1F5EE"/>
  <text x="135" y="133" font-family="sans-serif" font-size="11" fill="#2C2C2A">遍历所有BeanDefinition</text>

  <!-- 连接建立到接收消息的箭头 -->
  <line x1="128" y1="178" x2="578" y2="178" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 中部红色横幅 -->
  <rect x="20" y="225" width="640" height="50" rx="6" fill="#E24B4A"/>
  <text x="340" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Bean 存在于定义中，但从未被实例化</text>

  <!-- 红X标记 -->
  <line x1="48" y1="240" x2="68" y2="260" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="68" y1="240" x2="48" y2="260" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- 下部：全局懒加载 -->
  <rect x="20" y="290" width="640" height="215" rx="8" fill="#FDF2F0" stroke="#D85A30" stroke-width="1.5"/>
  <text x="340" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D85A30">全局懒加载开启（lazy-initialization: true）</text>

  <rect x="30" y="335" width="100" height="36" rx="6" fill="#D85A30"/>
  <text x="80" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">refresh()</text>

  <rect x="300" y="335" width="130" height="36" rx="6" fill="#FDF2F0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="365" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#D85A30">跳过lazyInit=true的Bean</text>

  <rect x="510" y="335" width="90" height="36" rx="6" fill="#FDF2F0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="555" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#D85A30">无人依赖它</text>

  <rect x="180" y="400" width="130" height="36" rx="6" fill="#FDF2F0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="245" y="422" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#D85A30">connect()从未执行</text>

  <rect x="360" y="400" width="110" height="36" rx="6" fill="#D85A30"/>
  <text x="415" y="422" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">连接从未建立</text>

  <rect x="520" y="400" width="130" height="36" rx="6" fill="#D85A30"/>
  <text x="585" y="415" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">无日志</text>
  <text x="585" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FFFFFF">无报错·无消息</text>

  <!-- 箭头 -->
  <line x1="130" y1="353" x2="298" y2="353" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="430" y1="353" x2="508" y2="353" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="310" y1="418" x2="358" y2="418" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="470" y1="418" x2="518" y2="418" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- 连接线：refresh → connect从未执行 -->
  <line x1="80" y1="371" x2="80" y2="398" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="80" y1="398" x2="178" y2="418" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>
</svg>
