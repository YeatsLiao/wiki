<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="sans-serif">
  <!-- Title -->
  <text x="340" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#2C2C2A">类加载流程与 AppCDS 优化点</text>

  <!-- Legend -->
  <circle cx="175" cy="48" r="5" fill="#185FA5"/>
  <text x="185" y="52" font-size="12" fill="#5F5E5A">查找步骤</text>
  <circle cx="285" cy="48" r="5" fill="#1D9E75"/>
  <text x="295" y="52" font-size="12" fill="#5F5E5A">解析步骤</text>
  <line x1="395" y1="48" x2="420" y2="48" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="425" y="52" font-size="12" fill="#5F5E5A">AppCDS 跳过</text>

  <!-- Column headers -->
  <text x="170" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">正常类加载</text>
  <text x="510" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">AppCDS 加速</text>

  <!-- AppCDS scope highlight (right column, steps 1-3) -->
  <rect x="383" y="78" width="254" height="157" rx="8" fill="#FDF0EB" fill-opacity="0.5" stroke="#D85A30" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="633" y="93" text-anchor="end" font-size="10" fill="#D85A30">AppCDS 作用域</text>

  <!-- Left column steps -->
  <rect x="50" y="85" width="240" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="170" y="109" text-anchor="middle" font-size="13" fill="#2C2C2A">JAR 包遍历</text>
  <text x="170" y="130" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="50" y="137" width="240" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="170" y="161" text-anchor="middle" font-size="13" fill="#2C2C2A">class 文件读取</text>
  <text x="170" y="182" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="50" y="189" width="240" height="38" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="170" y="213" text-anchor="middle" font-size="13" fill="#2C2C2A">校验</text>
  <text x="170" y="234" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="50" y="241" width="240" height="38" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="170" y="265" text-anchor="middle" font-size="13" fill="#2C2C2A">解析 (InstanceKlass)</text>
  <text x="170" y="286" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="50" y="293" width="240" height="38" rx="6" fill="#F5F4F0" stroke="#888780" stroke-width="1.5"/>
  <text x="170" y="317" text-anchor="middle" font-size="13" fill="#2C2C2A">初始化</text>

  <!-- AppCDS skip bracket around left steps 3-4 -->
  <rect x="43" y="182" width="254" height="104" rx="8" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Right column steps -->
  <rect x="390" y="85" width="240" height="38" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="510" y="109" text-anchor="middle" font-size="13" fill="#2C2C2A">jsa 归档</text>
  <text x="510" y="130" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="390" y="137" width="240" height="38" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="510" y="161" text-anchor="middle" font-size="13" fill="#2C2C2A">mmap 映射</text>
  <text x="510" y="182" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="390" y="189" width="240" height="38" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="510" y="213" text-anchor="middle" font-size="13" fill="#2C2C2A">直接得到 InstanceKlass</text>

  <!-- Skip annotation between columns -->
  <text x="340" y="238" text-anchor="middle" font-size="12" font-weight="500" fill="#D85A30">← 跳过</text>

  <!-- Arrow to step 4 -->
  <text x="510" y="286" text-anchor="middle" font-size="14" fill="#888780">↓</text>

  <rect x="390" y="293" width="240" height="38" rx="6" fill="#F5F4F0" stroke="#888780" stroke-width="1.5"/>
  <text x="510" y="317" text-anchor="middle" font-size="13" fill="#2C2C2A">初始化</text>

  <!-- Note -->
  <text x="340" y="365" text-anchor="middle" font-size="12" fill="#888780">只省了解析，Custom ClassLoader 场景下查找开销仍是大头</text>
</svg>
