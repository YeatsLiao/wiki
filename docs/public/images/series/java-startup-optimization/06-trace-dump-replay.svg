<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#185FA5"/>
    </marker>
    <marker id="arrow-sub" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888780"/>
    </marker>
  </defs>

  <!-- 顶部标题 -->
  <rect x="100" y="10" width="480" height="36" rx="6" fill="#185FA5"/>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">所有 JVM 层启动优化的统一模式：trace → dump → replay</text>

  <!-- 三段式主流程 -->
  <!-- trace -->
  <rect x="30" y="65" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#185FA5">步骤1：trace（记录）</text>
  <text x="115" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">首次启动时记录关键信息</text>

  <!-- dump -->
  <rect x="255" y="65" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#185FA5">步骤2：dump（持久化）</text>
  <text x="340" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">将信息写入归档文件</text>

  <!-- replay -->
  <rect x="480" y="65" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="565" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#185FA5">步骤3：replay（复用）</text>
  <text x="565" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">加载归档，跳过重复计算</text>

  <!-- 主箭头 -->
  <line x1="202" y1="95" x2="252" y2="95" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <line x1="427" y1="95" x2="477" y2="95" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow-main)"/>

  <!-- 分隔线 -->
  <line x1="30" y1="140" x2="650" y2="140" stroke="#C5C5C0" stroke-width="1"/>

  <!-- AppCDS 行 -->
  <rect x="30" y="155" width="170" height="34" rx="5" fill="#1D9E75"/>
  <text x="115" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">记录类加载过程</text>

  <rect x="255" y="155" width="170" height="34" rx="5" fill="#1D9E75"/>
  <text x="340" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">写入 InstanceKlass → .jsa</text>

  <rect x="480" y="155" width="170" height="34" rx="5" fill="#1D9E75"/>
  <text x="565" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">mmap .jsa，跳过类解析</text>

  <rect x="30" y="148" width="58" height="14" rx="3" fill="#1D9E75"/>
  <text x="59" y="158" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FFFFFF">AppCDS</text>

  <!-- Heap Archive 行 -->
  <rect x="30" y="204" width="170" height="34" rx="5" fill="#185FA5"/>
  <text x="115" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">记录类初始化过程</text>

  <rect x="255" y="204" width="170" height="34" rx="5" fill="#185FA5"/>
  <text x="340" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">static堆对象 → heap archive</text>

  <rect x="480" y="204" width="170" height="34" rx="5" fill="#185FA5"/>
  <text x="565" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">映射归档，跳过static初始化</text>

  <rect x="30" y="197" width="80" height="14" rx="3" fill="#185FA5"/>
  <text x="70" y="207" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FFFFFF">Heap Archive</text>

  <!-- AOT 行 -->
  <rect x="30" y="253" width="170" height="34" rx="5" fill="#D85A30"/>
  <text x="115" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">记录方法调用热度</text>

  <rect x="255" y="253" width="170" height="34" rx="5" fill="#D85A30"/>
  <text x="340" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">native代码 → .so</text>

  <rect x="480" y="253" width="170" height="34" rx="5" fill="#D85A30"/>
  <text x="565" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">加载.so，跳过解释执行</text>

  <rect x="30" y="246" width="42" height="14" rx="3" fill="#D85A30"/>
  <text x="51" y="256" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FFFFFF">AOT</text>

  <!-- 子箭头（AppCDS） -->
  <line x1="202" y1="172" x2="252" y2="172" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>
  <line x1="427" y1="172" x2="477" y2="172" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>

  <!-- 子箭头（Heap Archive） -->
  <line x1="202" y1="221" x2="252" y2="221" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>
  <line x1="427" y1="221" x2="477" y2="221" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>

  <!-- 子箭头（AOT） -->
  <line x1="202" y1="270" x2="252" y2="270" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>
  <line x1="427" y1="270" x2="477" y2="270" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow-sub)"/>

  <!-- 底部大循环箭头 -->
  <path d="M590,310 L590,350 L90,350 L90,310" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="90,314 84,304 96,304" fill="#185FA5"/>
  <rect x="180" y="338" width="320" height="24" rx="4" fill="#E6F1FB"/>
  <text x="340" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#185FA5">一次完整启动的代价，换取后续无数次启动的加速</text>

  <!-- Dragonwell 标注 -->
  <rect x="200" y="375" width="280" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1D9E75">Dragonwell 一次试运行，同时收集三类trace数据</text>

  <!-- trace → Dragonwell → dump 标注 -->
  <line x1="555" y1="125" x2="555" y2="148" stroke="#888780" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
