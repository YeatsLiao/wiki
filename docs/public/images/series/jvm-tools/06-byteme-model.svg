<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <rect width="680" height="360" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">Byte-Me：浏览器里的源码 → 字节码</text>

  <g font-family="sans-serif" font-size="13">
    <!-- top version switch -->
    <rect x="220" y="56" width="240" height="34" rx="17" fill="#e0e7ff"/>
    <text x="265" y="78" fill="#3730a3" text-anchor="middle">JDK 21</text>
    <text x="340" y="78" fill="#3730a3" text-anchor="middle">| JDK 22 | JDK 23</text>
    <text x="430" y="78" fill="#3730a3" text-anchor="middle">+preview</text>

    <!-- left source -->
    <rect x="40" y="120" width="260" height="160" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="56" y="146" fill="#3730a3" font-weight="bold">Java 源码</text>
    <text x="56" y="176" fill="#1f2937" font-size="12">int x = 1;</text>
    <text x="56" y="200" fill="#1f2937" font-size="12">x++;</text>
    <text x="56" y="224" fill="#1f2937" font-size="12">switch (s) {</text>
    <text x="56" y="248" fill="#1f2937" font-size="12">  case "a" -&gt; 1;</text>
    <text x="56" y="272" fill="#1f2937" font-size="12">}</text>

    <path d="M300 200 L345 200" stroke="#9ca3af" stroke-width="2" marker-end="url(#d)"/>
    <defs>
      <marker id="d" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
      </marker>
    </defs>
    <text x="322" y="190" fill="#6b7280" font-size="11" text-anchor="middle">编译</text>

    <!-- right bytecode -->
    <rect x="350" y="120" width="290" height="160" rx="10" fill="#111827"/>
    <text x="366" y="146" fill="#34d399" font-weight="bold">字节码</text>
    <text x="366" y="176" fill="#34d399" font-size="12">iconst_1</text>
    <text x="366" y="200" fill="#34d399" font-size="12">iinc 1, 1        ; int 独有</text>
    <text x="366" y="224" fill="#34d399" font-size="12">tableswitch ...  ; switch</text>
    <text x="366" y="248" fill="#34d399" font-size="12">lookupswitch ...</text>
    <text x="366" y="272" fill="#34d399" font-size="12">ireturn</text>

    <rect x="40" y="300" width="600" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="324" fill="#1f2937" font-size="12">左侧写、右侧实时出；切 JDK 版本即看同一段代码在不同版本的编译差异。示例库每条对应一个 JEP。</text>
  </g>
</svg>
