<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">hsdis：让 JIT 说出机器语言</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="40" y="80" width="150" height="70" rx="10" fill="#e0e7ff"/>
    <text x="115" y="108" fill="#3730a3" text-anchor="middle">Java 热点方法</text>
    <text x="115" y="128" fill="#3730a3" text-anchor="middle" font-size="11">被 C2 编译</text>

    <path d="M190 115 L240 115" stroke="#9ca3af" stroke-width="2" marker-end="url(#b)"/>
    <defs>
      <marker id="b" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
      </marker>
    </defs>

    <rect x="245" y="80" width="150" height="70" rx="10" fill="#d1fae5"/>
    <text x="320" y="108" fill="#065f46" text-anchor="middle">HotSpot JIT</text>
    <text x="320" y="128" fill="#065f46" text-anchor="middle" font-size="11">生成机器码</text>

    <path d="M395 115 L445 115" stroke="#9ca3ag" stroke-width="2" marker-end="url(#b)"/>
    <path d="M445 115 L445 115" stroke="#9ca3af" stroke-width="2" marker-end="url(#b)"/>

    <rect x="450" y="80" width="170" height="70" rx="10" fill="#fef3c7"/>
    <text x="535" y="104" fill="#92400e" text-anchor="middle">PrintAssembly</text>
    <text x="535" y="124" fill="#92400e" text-anchor="middle" font-size="11">+ hsdis 反汇编</text>

    <path d="M535 150 L535 185" stroke="#9ca3af" stroke-width="2" marker-end="url(#b)"/>

    <rect x="360" y="190" width="350" height="120" rx="10" fill="#111827"/>
    <text x="376" y="216" fill="#34d399" font-size="12">; 可读汇编输出</text>
    <text x="376" y="238" fill="#34d399" font-size="12">vmovdqu xmm0, [rdi+0x10]</text>
    <text x="376" y="260" fill="#34d399" font-size="12">vpxor    xmm1, xmm1, xmm1</text>
    <text x="376" y="282" fill="#34d399" font-size="12">vpcmpestri xmm1, xmm0, 0x1</text>

    <rect x="40" y="300" width="600" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="324" fill="#1f2937" font-size="12">hsdis = GNU binutils 的 libopcodes 薄包装；JDK 不自带，需下载放到</text>
    <text x="56" y="342" fill="#1f2937" font-size="12">JDK_HOME/lib/server/hsdis-&lt;arch&gt;.&lt;ext&gt;。属第三方构建，使用前请做安全评估。</text>
  </g>
</svg>
