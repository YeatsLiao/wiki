<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">从工具到方法论：一条可复用的调优链</text>

  <g font-family="sans-serif" font-size="12">
    <!-- tools row -->
    <rect x="40" y="70" width="120" height="44" rx="8" fill="#e0e7ff"/>
    <text x="100" y="97" fill="#3730a3" text-anchor="middle">Byte-Me</text>
    <rect x="180" y="70" width="120" height="44" rx="8" fill="#d1fae5"/>
    <text x="240" y="97" fill="#065f46" text-anchor="middle">JITWatch</text>
    <rect x="320" y="70" width="120" height="44" rx="8" fill="#fee2e2"/>
    <text x="380" y="97" fill="#991b1b" text-anchor="middle">GC Explorer</text>
    <rect x="460" y="70" width="120" height="44" rx="8" fill="#fef3c7"/>
    <text x="520" y="97" fill="#92400e" text-anchor="middle">VM Options</text>
    <rect x="40" y="124" width="120" height="44" rx="8" fill="#e9d5ff"/>
    <text x="100" y="151" fill="#6b21a8" text-anchor="middle">Intrinsics</text>
    <rect x="180" y="124" width="120" height="44" rx="8" fill="#cffafe"/>
    <text x="240" y="151" fill="#155e75" text-anchor="middle">JEP 三件套</text>

    <!-- arrow down -->
    <path d="M300 174 L300 210" stroke="#9ca3af" stroke-width="2" marker-end="url(#f)"/>
    <defs>
      <marker id="f" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
      </marker>
    </defs>

    <!-- method box -->
    <rect x="120" y="216" width="440" height="60" rx="10" fill="#374151"/>
    <text x="340" y="244" fill="#ffffff" text-anchor="middle" font-weight="bold">《Optimizing Java》方法论</text>
    <text x="340" y="264" fill="#cbd5e1" text-anchor="middle" font-size="11">测量 → 归因 → 验证（工具是显微镜，方法论是引擎）</text>

    <!-- chain -->
    <rect x="40" y="300" width="600" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="324" fill="#1f2937" font-size="12">现象(P99 抖) → GC 日志(九) → JITWatch(四) → VM Options+JaCoLine(二/五)</text>
    <text x="56" y="346" fill="#1f2937" font-size="12">→ Intrinsics(八) / Byte-Me(六) → JEP 三件套(七) 评估升级影响</text>
  </g>
</svg>
