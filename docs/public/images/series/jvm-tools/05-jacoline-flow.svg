<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <rect width="680" height="380" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">JaCoLine：给启动脚本做体检</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="40" y="80" width="220" height="80" rx="10" fill="#fee2e2"/>
    <text x="150" y="108" fill="#991b1b" text-anchor="middle" font-weight="bold">启动脚本命令行</text>
    <text x="150" y="130" fill="#991b1b" text-anchor="middle" font-size="11">-XX:+UseG1GC</text>
    <text x="150" y="148" fill="#991b1b" text-anchor="middle" font-size="11">-XX:+AggressiveOpts ...</text>

    <path d="M260 120 L320 120" stroke="#9ca3af" stroke-width="2" marker-end="url(#c)"/>
    <defs>
      <marker id="c" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
      </marker>
    </defs>

    <rect x="325" y="80" width="180" height="80" rx="10" fill="#e0e7ff"/>
    <text x="415" y="110" fill="#3730a3" text-anchor="middle" font-weight="bold">JaCoLine 解析</text>
    <text x="415" y="132" fill="#3730a3" text-anchor="middle" font-size="11">对照各 JDK 参数定义</text>
    <text x="415" y="150" fill="#3730a3" text-anchor="middle" font-size="11">选目标版本</text>

    <path d="M505 120 L555 120" stroke="#9ca3af" stroke-width="2" marker-end="url(#c)"/>

    <rect x="560" y="80" width="80" height="80" rx="10" fill="#d1fae5"/>
    <text x="600" y="112" fill="#065f46" text-anchor="middle" font-weight="bold">报告</text>
    <text x="600" y="132" fill="#065f46" text-anchor="middle" font-size="11">结构化</text>
    <text x="600" y="150" fill="#065f46" text-anchor="middle" font-size="11">结果</text>

    <!-- report rows -->
    <rect x="40" y="190" width="600" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="40" y="190" width="600" height="28" rx="8" fill="#f1f5f9"/>
    <text x="56" y="209" fill="#334155" font-size="12">体检结果</text>

    <circle cx="64" cy="240" r="6" fill="#dc2626"/>
    <text x="80" y="244" fill="#1f2937" font-size="12">Unknown / typo：不认识的参数（拼写错误高危）</text>
    <circle cx="64" cy="272" r="6" fill="#f59e0b"/>
    <text x="80" y="276" fill="#1f2937" font-size="12">Deprecated：该版本已废弃，建议替换</text>
    <circle cx="64" cy="304" r="6" fill="#ef4444"/>
    <text x="80" y="308" fill="#1f2937" font-size="12">Obsolete / Expired：该版本已移除，留着无效</text>
    <circle cx="64" cy="330" r="6" fill="#9ca3af"/>
    <text x="80" y="334" fill="#1f2937" font-size="12">Unavailable：在当前版本 / 发行版里不存在</text>
  </g>
</svg>
