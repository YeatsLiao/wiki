<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <rect width="680" height="400" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">VM Options Explorer：七个可叠加的筛选维度</text>

  <g font-family="sans-serif" font-size="13">
    <!-- filter pills -->
    <rect x="40" y="64" width="150" height="36" rx="18" fill="#e0e7ff"/>
    <text x="115" y="87" fill="#3730a3" text-anchor="middle">版本 OpenJDK 6~27</text>
    <rect x="205" y="64" width="110" height="36" rx="18" fill="#fee2e2"/>
    <text x="260" y="87" fill="#991b1b" text-anchor="middle">是否废弃</text>
    <rect x="330" y="64" width="100" height="36" rx="18" fill="#fef3c7"/>
    <text x="380" y="87" fill="#92400e" text-anchor="middle">数据类型</text>
    <rect x="445" y="64" width="90" height="36" rx="18" fill="#d1fae5"/>
    <text x="490" y="87" fill="#065f46" text-anchor="middle">操作系统</text>

    <rect x="40" y="112" width="100" height="36" rx="18" fill="#cffafe"/>
    <text x="90" y="135" fill="#155e75" text-anchor="middle">CPU 架构</text>
    <rect x="155" y="112" width="110" height="36" rx="18" fill="#e9d5ff"/>
    <text x="210" y="135" fill="#6b21a8" text-anchor="middle">所属组件</text>
    <rect x="280" y="112" width="130" height="36" rx="18" fill="#fce7f3"/>
    <text x="345" y="135" fill="#9d174d" text-anchor="middle">可用性等级 ★</text>
    <rect x="425" y="112" width="130" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="490" y="135" fill="#1f2937" text-anchor="middle">搜索框(名称)</text>

    <!-- arrow to table -->
    <path d="M340 156 L340 186" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
    <defs>
      <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
      </marker>
    </defs>

    <!-- table preview -->
    <rect x="40" y="194" width="600" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="40" y="194" width="600" height="30" rx="8" fill="#f1f5f9"/>
    <text x="56" y="214" fill="#334155" font-size="12">Name</text>
    <text x="220" y="214" fill="#334155" font-size="12">Type</text>
    <text x="320" y="214" fill="#334155" font-size="12">Default</text>
    <text x="430" y="214" fill="#334155" font-size="12">Availability</text>
    <text x="560" y="214" fill="#334155" font-size="12">Since</text>

    <line x1="40" y1="224" x2="640" y2="224" stroke="#e5e7eb"/>
    <text x="56" y="248" fill="#1f2937" font-size="12">MaxGCPauseMillis</text>
    <text x="220" y="248" fill="#1f2937" font-size="12">uintx</text>
    <text x="320" y="248" fill="#1f2937" font-size="12">max_uintx</text>
    <text x="430" y="248" fill="#065f46" font-size="12">product</text>
    <text x="560" y="248" fill="#1f2937" font-size="12">6</text>

    <text x="56" y="280" fill="#1f2937" font-size="12">AggressiveOpts</text>
    <text x="220" y="280" fill="#1f2937" font-size="12">bool</text>
    <text x="320" y="280" fill="#1f2937" font-size="12">false</text>
    <text x="430" y="280" fill="#991b1b" font-size="12">obsolete</text>
    <text x="560" y="280" fill="#1f2937" font-size="12">6</text>

    <text x="56" y="312" fill="#1f2937" font-size="12">AlwaysPreTouch</text>
    <text x="220" y="312" fill="#1f2937" font-size="12">bool</text>
    <text x="320" y="312" fill="#1f2937" font-size="12">false</text>
    <text x="430" y="312" fill="#065f46" font-size="12">product</text>
    <text x="560" y="312" fill="#1f2937" font-size="12">6</text>

    <text x="56" y="350" fill="#6b7280" font-size="11">每行一条参数，字段结构化；筛选条件叠加后即得子集</text>
  </g>
</svg>
