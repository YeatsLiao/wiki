<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430">
  <rect width="680" height="430" fill="#f7f9fc"/>
  <text x="340" y="34" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="sans-serif">Chris Newland 的 JVM 工具矩阵</text>
  <text x="340" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-family="sans-serif">沿「理解 JVM」的认知顺序铺开，彼此独立又串成链路</text>

  <g font-family="sans-serif" font-size="13">
    <!-- row 1 -->
    <rect x="20" y="72" width="130" height="40" rx="8" fill="#e0e7ff"/>
    <text x="85" y="96" fill="#3730a3" text-anchor="middle">字节码层</text>
    <rect x="165" y="72" width="150" height="40" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="240" y="96" fill="#1f2937" text-anchor="middle">Byte-Me</text>

    <!-- row 2 -->
    <rect x="20" y="124" width="130" height="40" rx="8" fill="#d1fae5"/>
    <text x="85" y="148" fill="#065f46" text-anchor="middle">JIT 编译层</text>
    <rect x="165" y="124" width="150" height="40" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="240" y="148" fill="#1f2937" text-anchor="middle">JITWatch</text>
    <rect x="325" y="124" width="120" height="40" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="385" y="148" fill="#1f2937" text-anchor="middle">hsdis</text>

    <!-- row 3 -->
    <rect x="20" y="176" width="130" height="40" rx="8" fill="#fee2e2"/>
    <text x="85" y="200" fill="#991b1b" text-anchor="middle">GC 层</text>
    <rect x="165" y="176" width="170" height="40" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="250" y="200" fill="#1f2937" text-anchor="middle">GC Explorer</text>

    <!-- row 4 -->
    <rect x="20" y="228" width="130" height="40" rx="8" fill="#fef3c7"/>
    <text x="85" y="252" fill="#92400e" text-anchor="middle">JVM 参数层</text>
    <rect x="165" y="228" width="200" height="40" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <text x="265" y="252" fill="#1f2937" text-anchor="middle">VM Options Explorer</text>
    <rect x="375" y="228" width="130" height="40" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <text x="440" y="252" fill="#1f2937" text-anchor="middle">JaCoLine</text>

    <!-- row 5 -->
    <rect x="20" y="280" width="130" height="40" rx="8" fill="#e9d5ff"/>
    <text x="85" y="304" fill="#6b21a8" text-anchor="middle">内建函数层</text>
    <rect x="165" y="280" width="240" height="40" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="285" y="304" fill="#1f2937" text-anchor="middle">VM Intrinsics Explorer</text>

    <!-- row 6 -->
    <rect x="20" y="332" width="130" height="40" rx="8" fill="#cffafe"/>
    <text x="85" y="356" fill="#155e75" text-anchor="middle">路线图层</text>
    <rect x="165" y="332" width="120" height="40" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="225" y="356" fill="#1f2937" text-anchor="middle">JEPMap</text>
    <rect x="295" y="332" width="130" height="40" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="360" y="356" fill="#1f2937" text-anchor="middle">JEPSearch</text>
    <rect x="435" y="332" width="120" height="40" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="495" y="356" fill="#1f2937" text-anchor="middle">FullJEP</text>

    <!-- row 7 -->
    <rect x="20" y="384" width="130" height="34" rx="8" fill="#374151"/>
    <text x="85" y="406" fill="#ffffff" text-anchor="middle">沉淀</text>
    <rect x="165" y="384" width="200" height="34" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="265" y="406" fill="#1f2937" text-anchor="middle">《Optimizing Java》</text>
  </g>
</svg>
