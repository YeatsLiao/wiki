<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">Azure IoT 总体架构（端 → 边 → 云）</text>

  <!-- 设备层 -->
  <rect x="30" y="60" width="140" height="90" rx="8" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="100" y="85" font-size="13" font-weight="700" fill="#0a4a7a" text-anchor="middle">设备 / 网关</text>
  <text x="100" y="105" font-size="11" fill="#5a6b85" text-anchor="middle">传感器 · 工控</text>
  <text x="100" y="122" font-size="11" fill="#5a6b85" text-anchor="middle">企业系统</text>

  <!-- 边缘 -->
  <rect x="30" y="180" width="140" height="90" rx="8" fill="#e8f2fb" stroke="#0078d4" stroke-width="2"/>
  <text x="100" y="205" font-size="13" font-weight="700" fill="#0a4a7a" text-anchor="middle">IoT Edge</text>
  <text x="100" y="225" font-size="11" fill="#5a6b85" text-anchor="middle">边缘运行时</text>
  <text x="100" y="242" font-size="11" fill="#5a6b85" text-anchor="middle">本地自治 · AI</text>

  <!-- 连线 设备->边缘 -->
  <line x1="100" y1="150" x2="100" y2="180" stroke="#9cc3e6" stroke-width="2"/>

  <!-- IoT Hub -->
  <rect x="230" y="120" width="180" height="120" rx="10" fill="#ffffff" stroke="#0066b4" stroke-width="2.5"/>
  <text x="320" y="148" font-size="15" font-weight="700" fill="#1f3a5f" text-anchor="middle">Azure IoT Hub</text>
  <text x="320" y="172" font-size="11" fill="#5a6b85" text-anchor="middle">· 协议 MQTT/AMQP/HTTPS</text>
  <text x="320" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">· X.509 / SAS 认证</text>
  <text x="320" y="208" font-size="11" fill="#5a6b85" text-anchor="middle">· 消息路由</text>
  <text x="320" y="226" font-size="11" fill="#5a6b85" text-anchor="middle">· 设备孪生 Twin</text>

  <!-- 设备/边缘 -> Hub -->
  <line x1="170" y1="105" x2="230" y2="160" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="170" y1="225" x2="230" y2="180" stroke="#9cc3e6" stroke-width="2"/>

  <!-- DPS -->
  <rect x="230" y="60" width="180" height="40" rx="8" fill="#fff4ec" stroke="#e0913f" stroke-width="1.8"/>
  <text x="320" y="84" font-size="11" font-weight="700" fill="#7d4a1a" text-anchor="middle">DPS 零接触预配</text>

  <!-- 下游服务 -->
  <g font-size="11" fill="#27496d">
    <rect x="470" y="55" width="150" height="34" rx="6" fill="#ffffff" stroke="#5aa0e0" stroke-width="1.5"/>
    <text x="545" y="76" text-anchor="middle">Event Hub（流）</text>

    <rect x="470" y="105" width="150" height="34" rx="6" fill="#ffffff" stroke="#5aa0e0" stroke-width="1.5"/>
    <text x="545" y="126" text-anchor="middle">Stream Analytics</text>

    <rect x="470" y="155" width="150" height="34" rx="6" fill="#ffffff" stroke="#5aa0e0" stroke-width="1.5"/>
    <text x="545" y="176" text-anchor="middle">Data Lake（存储）</text>

    <rect x="470" y="205" width="150" height="34" rx="6" fill="#ffffff" stroke="#5aa0e0" stroke-width="1.5"/>
    <text x="545" y="226" text-anchor="middle">Power BI（可视化）</text>

    <rect x="470" y="255" width="150" height="34" rx="6" fill="#ffffff" stroke="#5aa0e0" stroke-width="1.5"/>
    <text x="545" y="276" text-anchor="middle">Functions（计算）</text>
  </g>

  <!-- Hub -> 下游 -->
  <line x1="410" y1="150" x2="470" y2="72" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="410" y1="160" x2="470" y2="122" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="410" y1="180" x2="470" y2="172" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="410" y1="200" x2="470" y2="222" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="410" y1="210" x2="470" y2="272" stroke="#9cc3e6" stroke-width="2"/>

  <!-- 横向支撑服务 -->
  <g font-size="11" fill="#3a4a63">
    <rect x="230" y="270" width="180" height="30" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
    <text x="320" y="289" text-anchor="middle">Digital Twins（数字孪生）</text>

    <rect x="30" y="300" width="180" height="30" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
    <text x="120" y="319" text-anchor="middle">IoT Central（SaaS）</text>
  </g>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用微软官方版权图；精确产品边界以官方文档为准。</text>
</svg>
