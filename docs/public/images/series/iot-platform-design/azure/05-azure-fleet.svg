<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">Azure 海量设备管理：DPS + 注册表 + 边缘部署</text>

  <!-- 全球设备 -->
  <g font-size="11" fill="#27496d">
    <rect x="30" y="70" width="120" height="32" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="90" y="90" text-anchor="middle">中国设备</text>
    <rect x="30" y="115" width="120" height="32" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="90" y="135" text-anchor="middle">欧洲设备</text>
    <rect x="30" y="160" width="120" height="32" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
    <text x="90" y="180" text-anchor="middle">亚太设备</text>
  </g>

  <!-- DPS -->
  <rect x="175" y="100" width="120" height="60" rx="8" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="235" y="124" font-size="12" font-weight="700" fill="#7d4a1a" text-anchor="middle">DPS 全局端点</text>
  <text x="235" y="142" font-size="10" fill="#5a6b85" text-anchor="middle">分配策略</text>
  <text x="235" y="156" font-size="10" fill="#5a6b85" text-anchor="middle">→ 自动归属 Hub</text>

  <!-- 设备->DPS -->
  <line x1="150" y1="86" x2="175" y2="120" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="150" y1="131" x2="175" y2="130" stroke="#9cc3e6" stroke-width="2"/>
  <line x1="150" y1="176" x2="175" y2="140" stroke="#9cc3e6" stroke-width="2"/>

  <!-- 多 Hub -->
  <g font-size="10" fill="#3a4a63">
    <rect x="175" y="200" width="110" height="32" rx="6" fill="#e8f2fb" stroke="#0078d4" stroke-width="1.5"/>
    <text x="230" y="220" text-anchor="middle">华东 Hub</text>
    <rect x="175" y="240" width="110" height="32" rx="6" fill="#e8f2fb" stroke="#0078d4" stroke-width="1.5"/>
    <text x="230" y="260" text-anchor="middle">欧洲 Hub</text>
    <rect x="175" y="280" width="110" height="32" rx="6" fill="#e8f2fb" stroke="#0078d4" stroke-width="1.5"/>
    <text x="230" y="300" text-anchor="middle">亚太 Hub</text>
  </g>

  <!-- DPS -> Hub -->
  <line x1="235" y1="160" x2="230" y2="200" stroke="#e0913f" stroke-width="2"/>

  <!-- 统一注册表 -->
  <rect x="330" y="200" width="150" height="60" rx="8" fill="#ffffff" stroke="#0066b4" stroke-width="2"/>
  <text x="405" y="224" font-size="12" font-weight="700" fill="#1f3a5f" text-anchor="middle">统一设备注册表</text>
  <text x="405" y="244" font-size="10" fill="#5a6b85" text-anchor="middle">deviceId 唯一 · 批量</text>

  <!-- Hub -> 注册表 -->
  <line x1="285" y1="230" x2="330" y2="228" stroke="#9cc3e6" stroke-width="2"/>

  <!-- Edge 部署 -->
  <rect x="330" y="290" width="150" height="50" rx="8" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="2"/>
  <text x="405" y="312" font-size="12" font-weight="700" fill="#4a357a" text-anchor="middle">IoT Edge 部署</text>
  <text x="405" y="330" font-size="10" fill="#5a6b85" text-anchor="middle">清单 / 灰度 / 回滚</text>

  <!-- 注册表 -> Edge -->
  <line x1="405" y1="260" x2="405" y2="290" stroke="#8a6fd0" stroke-width="2"/>

  <!-- 运维视图 -->
  <rect x="510" y="200" width="150" height="80" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="585" y="228" font-size="12" font-weight="700" fill="#3a4a63" text-anchor="middle">运维视图</text>
  <text x="585" y="248" font-size="10" fill="#3a4a63" text-anchor="middle">在线/失联/部署中</text>
  <text x="585" y="266" font-size="10" fill="#3a4a63" text-anchor="middle">健康度可观测</text>

  <!-- Edge -> 运维 -->
  <line x1="480" y1="315" x2="510" y2="240" stroke="#5aa86a" stroke-width="2"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用微软官方版权图；精确产品边界以官方文档为准。</text>
</svg>
