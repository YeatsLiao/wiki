<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">腾讯云 IoT 总体架构（端 → 云 → 应用/小程序）</text>

  <!-- 设备层 -->
  <rect x="30" y="60" width="140" height="90" rx="8" fill="#ffffff" stroke="#0052d9" stroke-width="2"/>
  <text x="100" y="85" font-size="13" font-weight="700" fill="#07387a" text-anchor="middle">设备 / 网关</text>
  <text x="100" y="105" font-size="11" fill="#5a6b85" text-anchor="middle">智能硬件 · 家电</text>
  <text x="100" y="122" font-size="11" fill="#5a6b85" text-anchor="middle">共享设备</text>

  <!-- 微信/小程序 -->
  <rect x="30" y="180" width="140" height="90" rx="8" fill="#e7f0ff" stroke="#0052d9" stroke-width="2"/>
  <text x="100" y="205" font-size="13" font-weight="700" fill="#07387a" text-anchor="middle">腾讯连连</text>
  <text x="100" y="225" font-size="11" fill="#5a6b85" text-anchor="middle">微信小程序</text>
  <text x="100" y="242" font-size="11" fill="#5a6b85" text-anchor="middle">扫码直连查看</text>

  <!-- 连线 设备->小程序(经平台) -->
  <line x1="100" y1="150" x2="100" y2="180" stroke="#9bb8e8" stroke-width="2"/>

  <!-- IoT Explorer -->
  <rect x="230" y="120" width="180" height="120" rx="10" fill="#ffffff" stroke="#0a4fbf" stroke-width="2.5"/>
  <text x="320" y="148" font-size="15" font-weight="700" fill="#1f3a5f" text-anchor="middle">IoT Explorer</text>
  <text x="320" y="172" font-size="11" fill="#5a6b85" text-anchor="middle">· 协议 MQTT/CoAP/WS</text>
  <text x="320" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">· 认证 / 数据模板</text>
  <text x="320" y="208" font-size="11" fill="#5a6b85" text-anchor="middle">· 规则引擎 转发</text>
  <text x="320" y="226" font-size="11" fill="#5a6b85" text-anchor="middle">· 设备影子</text>

  <!-- 设备/小程序 -> Explorer -->
  <line x1="170" y1="105" x2="230" y2="160" stroke="#9bb8e8" stroke-width="2"/>
  <line x1="170" y1="225" x2="230" y2="180" stroke="#9bb8e8" stroke-width="2"/>

  <!-- 下游服务 -->
  <g font-size="11" fill="#27496d">
    <rect x="470" y="55" width="150" height="34" rx="6" fill="#ffffff" stroke="#5a8fe0" stroke-width="1.5"/>
    <text x="545" y="76" text-anchor="middle">云数据库（存储）</text>

    <rect x="470" y="105" width="150" height="34" rx="6" fill="#ffffff" stroke="#5a8fe0" stroke-width="1.5"/>
    <text x="545" y="126" text-anchor="middle">消息队列 CKafka</text>

    <rect x="470" y="155" width="150" height="34" rx="6" fill="#ffffff" stroke="#5a8fe0" stroke-width="1.5"/>
    <text x="545" y="176" text-anchor="middle">云函数 SCF</text>

    <rect x="470" y="205" width="150" height="34" rx="6" fill="#ffffff" stroke="#5a8fe0" stroke-width="1.5"/>
    <text x="545" y="226" text-anchor="middle">数据看板 / 应用</text>

    <rect x="470" y="255" width="150" height="34" rx="6" fill="#ffffff" stroke="#5a8fe0" stroke-width="1.5"/>
    <text x="545" y="276" text-anchor="middle">大数据 / AI</text>
  </g>

  <!-- Explorer -> 下游 -->
  <line x1="410" y1="150" x2="470" y2="72" stroke="#9bb8e8" stroke-width="2"/>
  <line x1="410" y1="160" x2="470" y2="122" stroke="#9bb8e8" stroke-width="2"/>
  <line x1="410" y1="180" x2="470" y2="172" stroke="#9bb8e8" stroke-width="2"/>
  <line x1="410" y1="200" x2="470" y2="222" stroke="#9bb8e8" stroke-width="2"/>
  <line x1="410" y1="210" x2="470" y2="272" stroke="#9bb8e8" stroke-width="2"/>

  <!-- 横向支撑服务 -->
  <g font-size="11" fill="#3a4a63">
    <rect x="230" y="270" width="180" height="30" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
    <text x="320" y="289" text-anchor="middle">设备管理（注册/OTA）</text>

    <rect x="30" y="300" width="180" height="30" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
    <text x="120" y="319" text-anchor="middle">数据模板（物模型）</text>
  </g>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用腾讯云官方版权图；精确产品边界以官方文档为准。</text>
</svg>
