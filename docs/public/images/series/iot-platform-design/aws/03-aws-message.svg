<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="380" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">AWS IoT 消息与规则引擎</text>

  <!-- 设备 -->
  <rect x="30" y="150" width="120" height="70" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="90" y="178" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">设备</text>
  <text x="90" y="198" font-size="11" fill="#5a6b85" text-anchor="middle">发布 topic</text>

  <!-- 消息代理 -->
  <rect x="200" y="150" width="130" height="70" rx="8" fill="#eef4ff" stroke="#3f6fd1" stroke-width="2"/>
  <text x="265" y="178" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">消息代理</text>
  <text x="265" y="198" font-size="10" fill="#5a6b85" text-anchor="middle">MQTT / HTTP</text>

  <!-- 规则引擎 SQL -->
  <rect x="380" y="140" width="140" height="60" rx="8" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="450" y="164" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">规则引擎 SQL</text>
  <text x="450" y="182" font-size="10" fill="#5a6b85" text-anchor="middle">过滤 / 投影 / 转换</text>

  <!-- 影子 -->
  <rect x="380" y="230" width="140" height="60" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="450" y="254" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">设备影子 Shadow</text>
  <text x="450" y="272" font-size="10" fill="#5a6b85" text-anchor="middle">reported / desired</text>

  <!-- 下游动作 -->
  <g font-size="11" fill="#27496d">
    <rect x="560" y="55" width="110" height="32" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.5"/>
    <text x="615" y="75" text-anchor="middle">Lambda 告警</text>
    <rect x="560" y="105" width="110" height="32" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.5"/>
    <text x="615" y="125" text-anchor="middle">S3 冷存</text>
    <rect x="560" y="155" width="110" height="32" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.5"/>
    <text x="615" y="175" text-anchor="middle">DynamoDB</text>
    <rect x="560" y="205" width="110" height="32" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.5"/>
    <text x="615" y="225" text-anchor="middle">Kinesis 流</text>
  </g>

  <!-- 连线 -->
  <line x1="150" y1="185" x2="200" y2="185" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="180" x2="380" y2="170" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="190" x2="380" y2="250" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="520" y1="160" x2="560" y2="71" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="520" y1="165" x2="560" y2="121" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="520" y1="170" x2="560" y2="171" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="520" y1="175" x2="560" y2="221" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 应用读影子 -->
  <rect x="200" y="300" width="130" height="40" rx="8" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="265" y="324" font-size="11" font-weight="700" fill="#3a4a63" text-anchor="middle">业务应用</text>
  <line x1="265" y1="300" x2="450" y2="290" stroke="#b9a6e0" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="340" y="365" font-size="11" fill="#8a97ad" text-anchor="middle">说明：手绘示意，未使用 AWS 官方版权图；精确服务以官方文档为准。</text>
</svg>
