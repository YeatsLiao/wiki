<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="380" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">AWS IoT Core 连接层</text>

  <!-- 设备 -->
  <rect x="30" y="90" width="120" height="70" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="90" y="118" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">设备 / 网关</text>
  <text x="90" y="138" font-size="11" fill="#5a6b85" text-anchor="middle">MQTT / WS / HTTP</text>

  <!-- 接入端点 -->
  <rect x="200" y="90" width="130" height="70" rx="8" fill="#eef4ff" stroke="#3f6fd1" stroke-width="2"/>
  <text x="265" y="115" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">接入端点</text>
  <text x="265" y="135" font-size="11" fill="#5a6b85" text-anchor="middle">TLS 1.2+ 终结</text>

  <!-- 认证 -->
  <rect x="380" y="50" width="130" height="60" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="445" y="74" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">认证</text>
  <text x="445" y="92" font-size="10" fill="#5a6b85" text-anchor="middle">X.509 / Cognito</text>

  <!-- JITP -->
  <rect x="380" y="130" width="130" height="60" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="445" y="154" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">JITP 自动注册</text>
  <text x="445" y="172" font-size="10" fill="#5a6b85" text-anchor="middle">首连即建 Thing</text>

  <!-- 策略 -->
  <rect x="380" y="210" width="130" height="60" rx="8" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="445" y="234" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">IoT Policy</text>
  <text x="445" y="252" font-size="10" fill="#5a6b85" text-anchor="middle">细粒度授权</text>

  <!-- 平台内部 -->
  <rect x="560" y="120" width="100" height="120" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="610" y="150" font-size="12" font-weight="700" fill="#1f3a5f" text-anchor="middle">平台内部</text>
  <text x="610" y="172" font-size="10" fill="#5a6b85" text-anchor="middle">设备影子</text>
  <text x="610" y="190" font-size="10" fill="#5a6b85" text-anchor="middle">规则引擎</text>
  <text x="610" y="208" font-size="10" fill="#5a6b85" text-anchor="middle">时序/分析</text>

  <!-- 连线 -->
  <line x1="150" y1="125" x2="200" y2="125" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="120" x2="380" y2="80" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="125" x2="380" y2="160" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="130" x2="380" y2="240" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="510" y1="80" x2="560" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="510" y1="160" x2="560" y2="170" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="510" y1="240" x2="560" y2="190" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 拒绝分支 -->
  <line x1="445" y1="270" x2="445" y2="320" stroke="#e08a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="455" y="305" font-size="10" fill="#c05555">拒绝 → CloudWatch 记录</text>

  <text x="340" y="360" font-size="11" fill="#8a97ad" text-anchor="middle">说明：手绘示意，未使用 AWS 官方版权图；精确流程以官方文档为准。</text>
</svg>
