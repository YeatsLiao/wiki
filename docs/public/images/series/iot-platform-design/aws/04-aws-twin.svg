<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="400" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">AWS 物模型与数字孪生（抽象度由低到高）</text>

  <!-- 设备 -->
  <rect x="30" y="170" width="120" height="70" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="90" y="198" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">物理设备</text>
  <text x="90" y="218" font-size="11" fill="#5a6b85" text-anchor="middle">异构 / 多协议</text>

  <!-- 影子 -->
  <rect x="200" y="170" width="130" height="70" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="265" y="198" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">设备影子</text>
  <text x="265" y="218" font-size="10" fill="#5a6b85" text-anchor="middle">reported/desired</text>

  <!-- 模型 -->
  <rect x="370" y="170" width="130" height="70" rx="8" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="435" y="198" font-size="12" font-weight="700" fill="#27496d" text-anchor="middle">Thing Model</text>
  <text x="435" y="218" font-size="10" fill="#5a6b85" text-anchor="middle">可复用模板</text>

  <!-- 数字孪生 -->
  <rect x="540" y="150" width="120" height="90" rx="10" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="2.5"/>
  <text x="600" y="180" font-size="12" font-weight="700" fill="#3a4a63" text-anchor="middle">TwinMaker</text>
  <text x="600" y="200" font-size="10" fill="#5a6b85" text-anchor="middle">实体-组件</text>
  <text x="600" y="218" font="10" fill="#5a6b85" text-anchor="middle">-关系 图</text>

  <!-- 连线 设备->影子->模型->孪生 -->
  <line x1="150" y1="205" x2="200" y2="205" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="330" y1="205" x2="370" y2="205" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="500" y1="205" x2="540" y2="195" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 抽象度箭头 -->
  <text x="335" y="160" font-size="11" fill="#8a97ad" text-anchor="middle">抽象度 ↑</text>
  <line x1="600" y1="135" x2="600" y2="150" stroke="#b9a6e0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 孪生下游：场景看板 -->
  <rect x="540" y="270" width="120" height="40" rx="8" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="600" y="294" font-size="11" font-weight="700" fill="#3a4a63" text-anchor="middle">3D 场景看板</text>
  <line x1="600" y1="240" x2="600" y2="270" stroke="#b9a6e0" stroke-width="2"/>

  <!-- 数据接入 -->
  <g font-size="10" fill="#5a6b85">
    <rect x="370" y="300" width="120" height="30" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.2"/>
    <text x="430" y="319" text-anchor="middle">时序数据库</text>
    <rect x="200" y="300" width="120" height="30" rx="6" fill="#ffffff" stroke="#7aa0e0" stroke-width="1.2"/>
    <text x="260" y="319" text-anchor="middle">视频 / 告警</text>
  </g>
  <line x1="430" y1="290" x2="430" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="260" y1="290" x2="540" y2="285" stroke="#9bb4dd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b9a6e0"/>
    </marker>
  </defs>

  <text x="340" y="385" font-size="11" fill="#8a97ad" text-anchor="middle">说明：手绘示意，未使用 AWS 官方版权图；精确建模方式以官方文档为准。</text>
</svg>
