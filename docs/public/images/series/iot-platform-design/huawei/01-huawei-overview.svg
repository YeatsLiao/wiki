<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">华为云 IoT 总体架构（端 → 边 → 云）</text>

  <!-- 设备层 -->
  <rect x="30" y="60" width="140" height="90" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="85" font-size="13" font-weight="700" fill="#7d241a" text-anchor="middle">设备 / 网关</text>
  <text x="100" y="105" font-size="11" fill="#5a6b85" text-anchor="middle">传感器 · 车机</text>
  <text x="100" y="122" font-size="11" fill="#5a6b85" text-anchor="middle">水/电表 · PLC</text>

  <!-- 边缘 -->
  <rect x="30" y="180" width="140" height="90" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="205" font-size="13" font-weight="700" fill="#7d241a" text-anchor="middle">IoT 边缘</text>
  <text x="100" y="225" font-size="11" fill="#5a6b85" text-anchor="middle">本地自治</text>
  <text x="100" y="242" font-size="11" fill="#5a6b85" text-anchor="middle">协议转换 · 计算</text>

  <!-- 连线 设备->边缘 -->
  <line x1="100" y1="150" x2="100" y2="180" stroke="#e0a39c" stroke-width="2"/>

  <!-- IoTDA -->
  <rect x="230" y="120" width="180" height="120" rx="10" fill="#ffffff" stroke="#a93226" stroke-width="2.5"/>
  <text x="320" y="148" font-size="15" font-weight="700" fill="#1f3a5f" text-anchor="middle">设备接入 IoTDA</text>
  <text x="320" y="172" font-size="11" fill="#5a6b85" text-anchor="middle">· 协议终结 MQTTS/CoAP</text>
  <text x="320" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">· X.509 / 设备证明</text>
  <text x="320" y="208" font-size="11" fill="#5a6b85" text-anchor="middle">· 规则引擎 转发</text>
  <text x="320" y="226" font-size="11" fill="#5a6b85" text-anchor="middle">· 设备影子</text>

  <!-- 设备/边缘 -> IoTDA -->
  <line x1="170" y1="105" x2="230" y2="160" stroke="#e0a39c" stroke-width="2"/>
  <line x1="170" y1="225" x2="230" y2="180" stroke="#e0a39c" stroke-width="2"/>

  <!-- 下游服务 -->
  <g font-size="11" fill="#27496d">
    <rect x="470" y="55" width="150" height="34" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="1.5"/>
    <text x="545" y="76" text-anchor="middle">DIS / Kafka（流）</text>

    <rect x="470" y="105" width="150" height="34" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="1.5"/>
    <text x="545" y="126" text-anchor="middle">OBS（存储）</text>

    <rect x="470" y="155" width="150" height="34" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="1.5"/>
    <text x="545" y="176" text-anchor="middle">函数工作流（计算）</text>

    <rect x="470" y="205" width="150" height="34" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="1.5"/>
    <text x="545" y="226" text-anchor="middle">数据库 / 时序</text>

    <rect x="470" y="255" width="150" height="34" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="1.5"/>
    <text x="545" y="276" text-anchor="middle">应用 / 大屏</text>
  </g>

  <!-- IoTDA -> 下游 -->
  <line x1="410" y1="150" x2="470" y2="72" stroke="#e0a39c" stroke-width="2"/>
  <line x1="410" y1="160" x2="470" y2="122" stroke="#e0a39c" stroke-width="2"/>
  <line x1="410" y1="180" x2="470" y2="172" stroke="#e0a39c" stroke-width="2"/>
  <line x1="410" y1="200" x2="470" y2="222" stroke="#e0a39c" stroke-width="2"/>
  <line x1="410" y1="210" x2="470" y2="272" stroke="#e0a39c" stroke-width="2"/>

  <!-- 横向支撑服务 -->
  <g font-size="11" fill="#3a4a63">
    <rect x="230" y="270" width="170" height="30" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
    <text x="315" y="289" text-anchor="middle">设备管理服务（注册/OTA）</text>

    <rect x="30" y="300" width="170" height="30" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
    <text x="115" y="319" text-anchor="middle">全球 SIM / 连接管理</text>

    <rect x="430" y="310" width="190" height="30" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
    <text x="525" y="329" text-anchor="middle">数字孪生 / 建模</text>
  </g>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用华为云官方版权图；精确产品边界以官方文档为准。</text>
</svg>
