<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">华为云 物模型（产品模型）与数字孪生</text>

  <!-- 异构设备 -->
  <g font-size="11" fill="#27496d">
    <rect x="30" y="60" width="130" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="95" y="81" text-anchor="middle">设备A: temp</text>
    <rect x="30" y="105" width="130" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="95" y="126" text-anchor="middle">设备B: temperature</text>
    <rect x="30" y="150" width="130" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="95" y="171" text-anchor="middle">设备C: 0x10寄存器</text>
  </g>

  <!-- 产品模型 -->
  <rect x="210" y="80" width="200" height="130" rx="10" fill="#ffffff" stroke="#a93226" stroke-width="2.5"/>
  <text x="310" y="108" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">产品模型（物模型）</text>
  <text x="310" y="132" font-size="11" fill="#5a6b85" text-anchor="middle">· 属性 Property（状态）</text>
  <text x="310" y="150" font-size="11" fill="#5a6b85" text-anchor="middle">· 命令 Command（动作）</text>
  <text x="310" y="168" font-size="11" fill="#5a6b85" text-anchor="middle">· 事件 Event（通知）</text>
  <text x="310" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">→ 统一语义归一</text>

  <!-- 设备->模型 -->
  <line x1="160" y1="77" x2="210" y2="120" stroke="#e0a39c" stroke-width="2"/>
  <line x1="160" y1="122" x2="210" y2="140" stroke="#e0a39c" stroke-width="2"/>
  <line x1="160" y1="167" x2="210" y2="160" stroke="#e0a39c" stroke-width="2"/>

  <!-- 归一后 -->
  <rect x="210" y="240" width="200" height="44" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="310" y="266" font-size="12" font-weight="700" fill="#3a4a63" text-anchor="middle">应用只认</text>
  <text x="310" y="284" font-size="11" fill="#3a4a63" text-anchor="middle">temperature / flow ...</text>

  <!-- 模型 -> 归一 -->
  <line x1="310" y1="210" x2="310" y2="240" stroke="#5aa86a" stroke-width="2"/>

  <!-- 数字孪生 -->
  <rect x="450" y="70" width="200" height="220" rx="10" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="2.5"/>
  <text x="550" y="98" font-size="14" font-weight="700" fill="#4a357a" text-anchor="middle">数字孪生</text>
  <rect x="470" y="115" width="160" height="30" rx="6" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="550" y="134" font-size="11" fill="#3a4a63" text-anchor="middle">工厂 Factory</text>
  <rect x="490" y="158" width="140" height="30" rx="6" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="560" y="177" font-size="11" fill="#3a4a63" text-anchor="middle">产线 Line-1</text>
  <rect x="510" y="201" width="120" height="28" rx="6" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="570" y="219" font-size="11" fill="#3a4a63" text-anchor="middle">设备 机床-01</text>
  <text x="550" y="252" font-size="10" fill="#5a6b85" text-anchor="middle">属性 / 命令 / 事件</text>
  <text x="550" y="270" font-size="10" fill="#5a6b85" text-anchor="middle">关系: 工厂→产线→设备</text>

  <!-- 模型 -> 孪生 -->
  <line x1="410" y1="145" x2="450" y2="130" stroke="#b9a6e8" stroke-width="2"/>
  <line x1="410" y1="260" x2="450" y2="180" stroke="#b9a6e8" stroke-width="2"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用华为云官方版权图；精确产品边界以官方文档为准。</text>
</svg>
