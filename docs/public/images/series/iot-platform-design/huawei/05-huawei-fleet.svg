<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">华为云 海量设备管理：注册 + OTA + 全球接入</text>

  <!-- 全球设备 -->
  <g font-size="11" fill="#27496d">
    <rect x="30" y="70" width="120" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="90" y="90" text-anchor="middle">中国设备</text>
    <rect x="30" y="115" width="120" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="90" y="135" text-anchor="middle">欧洲设备</text>
    <rect x="30" y="160" width="120" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="90" y="180" text-anchor="middle">亚太设备</text>
  </g>

  <!-- 多 Region -->
  <g font-size="10" fill="#3a4a63">
    <rect x="175" y="70" width="90" height="32" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.5"/>
    <text x="220" y="90" text-anchor="middle">华东 Region</text>
    <rect x="175" y="115" width="90" height="32" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.5"/>
    <text x="220" y="135" text-anchor="middle">欧洲 Region</text>
    <rect x="175" y="160" width="90" height="32" rx="6" fill="#eef4ff" stroke="#5b8def" stroke-width="1.5"/>
    <text x="220" y="180" text-anchor="middle">亚太 Region</text>
  </g>

  <!-- 设备->Region -->
  <line x1="150" y1="86" x2="175" y2="86" stroke="#e0a39c" stroke-width="2"/>
  <line x1="150" y1="131" x2="175" y2="131" stroke="#e0a39c" stroke-width="2"/>
  <line x1="150" y1="176" x2="175" y2="176" stroke="#e0a39c" stroke-width="2"/>

  <!-- IoTDA 统一 -->
  <rect x="300" y="90" width="170" height="120" rx="10" fill="#ffffff" stroke="#a93226" stroke-width="2.5"/>
  <text x="385" y="118" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">华为云 IoTDA</text>
  <text x="385" y="142" font-size="11" fill="#5a6b85" text-anchor="middle">· 统一设备注册表</text>
  <text x="385" y="160" font-size="11" fill="#5a6b85" text-anchor="middle">· 全球设备视图</text>
  <text x="385" y="178" font-size="11" fill="#5a6b85" text-anchor="middle">· 任务制 OTA</text>
  <text x="385" y="196" font-size="11" fill="#5a6b85" text-anchor="middle">· 设备影子</text>

  <!-- Region -> IoTDA -->
  <line x1="265" y1="86" x2="300" y2="130" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="265" y1="131" x2="300" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="265" y1="176" x2="300" y2="170" stroke="#9bb4dd" stroke-width="2"/>

  <!-- OTA 任务 -->
  <rect x="300" y="240" width="170" height="70" rx="10" fill="#fff4ec" stroke="#e0913f" stroke-width="2.5"/>
  <text x="385" y="266" font-size="13" font-weight="700" fill="#7d4a1a" text-anchor="middle">OTA 批量任务</text>
  <text x="385" y="288" font-size="11" fill="#5a6b85" text-anchor="middle">分组 / 灰度 / 回滚</text>
  <text x="385" y="306" font-size="11" fill="#5a6b85" text-anchor="middle">通过影子下发</text>

  <!-- IoTDA -> OTA -->
  <line x1="385" y1="210" x2="385" y2="240" stroke="#e0913f" stroke-width="2"/>

  <!-- 运维视图 -->
  <rect x="510" y="150" width="150" height="80" rx="8" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="585" y="178" font-size="12" font-weight="700" fill="#3a4a63" text-anchor="middle">运维视图</text>
  <text x="585" y="198" font-size="11" fill="#3a4a63" text-anchor="middle">在线/失联/升级中</text>
  <text x="585" y="216" font-size="11" fill="#3a4a63" text-anchor="middle">可审计可追溯</text>

  <!-- IoTDA -> 运维 -->
  <line x1="470" y1="150" x2="510" y2="175" stroke="#5aa86a" stroke-width="2"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用华为云官方版权图；精确产品边界以官方文档为准。</text>
</svg>
