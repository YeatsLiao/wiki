<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">米家配网激活与弱网自适应（进得来 · 控得稳 · 待得住 · 活得久）</text>

  <!-- 米家App -->
  <rect x="30" y="60" width="140" height="70" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="100" y="88" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">米家 App</text>
  <text x="100" y="110" font-size="11" fill="#5a6b85" text-anchor="middle">扫码 / 蓝牙辅助</text>

  <!-- 路由器 -->
  <rect x="30" y="155" width="140" height="70" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="100" y="183" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">家用路由器</text>
  <text x="100" y="205" font-size="11" fill="#5a6b85" text-anchor="middle">Wi-Fi AP（2.4G）</text>

  <!-- 无屏设备 -->
  <rect x="220" y="80" width="170" height="140" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="305" y="106" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">米家设备</text>
  <text x="305" y="132" font-size="11" fill="#5a6b85" text-anchor="middle">① 扫码配网</text>
  <text x="305" y="152" font-size="11" fill="#5a6b85" text-anchor="middle">② 蓝牙辅助配网</text>
  <text x="305" y="172" font-size="11" fill="#5a6b85" text-anchor="middle">③ 一键快连</text>
  <text x="305" y="198" font-size="11" fill="#27496d" text-anchor="middle">小米模组 · 密钥不下落</text>

  <!-- 云端 -->
  <rect x="470" y="95" width="170" height="120" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="555" y="122" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">小米云（MiOT）</text>
  <text x="555" y="148" font-size="11" fill="#5a6b85" text-anchor="middle">一机一密激活</text>
  <text x="555" y="168" font-size="11" fill="#5a6b85" text-anchor="middle">双向认证 · 建身份</text>
  <text x="555" y="188" font-size="11" fill="#5a6b85" text-anchor="middle">局域网+云端双通道</text>

  <!-- 连线 -->
  <line x1="100" y1="130" x2="100" y2="155" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="170" y1="95" x2="220" y2="112" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="170" y1="190" x2="220" y2="170" stroke="#c9b3e8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="390" y1="150" x2="470" y2="150" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 底部三类连接策略 -->
  <rect x="40" y="300" width="180" height="34" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="130" y="322" font-size="12" fill="#2f6b3d" text-anchor="middle">局域网本地联动（断网可用）</text>

  <rect x="250" y="300" width="180" height="34" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
  <text x="340" y="322" font-size="12" fill="#8a5a1f" text-anchor="middle">断线重连（指数退避）</text>

  <rect x="460" y="300" width="180" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="550" y="322" font-size="12" fill="#4d3a82" text-anchor="middle">低功耗休眠（唤醒周期）</text>

  <line x1="305" y1="220" x2="130" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="305" y1="220" x2="340" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="305" y1="220" x2="550" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以米家/MiOT 官方文档为准。</text>
</svg>
