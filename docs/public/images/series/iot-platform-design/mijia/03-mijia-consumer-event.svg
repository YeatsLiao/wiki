<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">米家事件驱动与App联动（设备事件 → 小米云 → 多端）</text>

  <!-- 设备事件 -->
  <rect x="30" y="95" width="140" height="120" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="100" y="120" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">设备事件</text>
  <text x="100" y="145" font-size="11" fill="#5a6b85" text-anchor="middle">门锁「开门」</text>
  <text x="100" y="165" font-size="11" fill="#5a6b85" text-anchor="middle">传感器触发</text>
  <text x="100" y="185" font-size="11" fill="#5a6b85" text-anchor="middle">状态变化</text>
  <text x="100" y="205" font-size="11" fill="#5a6b85" text-anchor="middle">（经小米云上行）</text>

  <!-- 规则引擎 -->
  <rect x="245" y="80" width="185" height="170" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="337" y="108" font-size="15" font-weight="700" fill="#1f3a5f" text-anchor="middle">小米云规则引擎</text>
  <text x="337" y="135" font-size="11" fill="#5a6b85" text-anchor="middle">· 订阅设备事件</text>
  <text x="337" y="160" font-size="11" fill="#27496d" text-anchor="middle">· 场景：开门 → 开灯</text>
  <text x="337" y="185" font-size="11" fill="#5a6b85" text-anchor="middle">· 回家模式编排</text>
  <text x="337" y="210" font-size="11" fill="#5a6b85" text-anchor="middle">· 多端转发</text>

  <!-- App推送 -->
  <rect x="500" y="60" width="150" height="70" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="575" y="88" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">米家 App 推送</text>
  <text x="575" y="110" font-size="11" fill="#5a6b85" text-anchor="middle">通知栏 / 消息</text>

  <!-- 灯设备 -->
  <rect x="500" y="150" width="150" height="70" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="575" y="178" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">灯设备</text>
  <text x="575" y="200" font-size="11" fill="#5a6b85" text-anchor="middle">开灯指令下行</text>

  <!-- 小爱同学 -->
  <rect x="500" y="240" width="150" height="55" rx="8" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="575" y="268" font-size="12" fill="#4d3a82" text-anchor="middle">小爱同学</text>
  <text x="575" y="286" font-size="11" fill="#4d3a82" text-anchor="middle">NL → 意图 → 场景</text>

  <!-- 连线 -->
  <line x1="170" y1="150" x2="245" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="430" y1="120" x2="500" y2="95" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="430" y1="160" x2="500" y2="185" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="430" y1="200" x2="500" y2="265" stroke="#c9b3e8" stroke-width="1.6"/>

  <!-- 底部 QoS / 离线 -->
  <rect x="40" y="300" width="180" height="34" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="130" y="322" font-size="12" fill="#2f6b3d" text-anchor="middle">QoS 分级（可靠投递）</text>

  <rect x="250" y="300" width="180" height="34" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
  <text x="340" y="322" font-size="12" fill="#8a5a1f" text-anchor="middle">离线消息（影子补发）</text>

  <rect x="460" y="300" width="180" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="550" y="322" font-size="12" fill="#4d3a82" text-anchor="middle">本地联动（断网可用）</text>

  <line x1="337" y1="250" x2="130" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="337" y1="250" x2="340" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="337" y1="250" x2="550" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以米家/MiOT 官方文档为准。</text>
</svg>
