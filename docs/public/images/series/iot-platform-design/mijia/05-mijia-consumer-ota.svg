<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">米家统一 OTA 与批量运营（签名 · 差分 · 灰度 · 回滚）</text>

  <!-- 云端OTA -->
  <rect x="30" y="90" width="160" height="120" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="110" y="115" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">小米云 OTA</text>
  <text x="110" y="142" font-size="11" fill="#5a6b85" text-anchor="middle">· 制作差分包</text>
  <text x="110" y="166" font-size="11" fill="#5a6b85" text-anchor="middle">· 固件签名</text>
  <text x="110" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">· 下发任务</text>

  <!-- 灰度发布 -->
  <rect x="240" y="80" width="185" height="155" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="332" y="105" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">灰度发布</text>
  <text x="332" y="132" font-size="11" fill="#5a6b85" text-anchor="middle">· 开启测试验证</text>
  <text x="332" y="156" font-size="11" fill="#5a6b85" text-anchor="middle">· 分批扩量</text>
  <text x="332" y="180" font-size="11" fill="#5a6b85" text-anchor="middle">· 100% 全量</text>
  <text x="332" y="204" font-size="11" fill="#27496d" text-anchor="middle">· 监控崩溃/失败率</text>

  <!-- 设备群 -->
  <rect x="470" y="85" width="165" height="140" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="552" y="110" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">米家设备群</text>
  <text x="552" y="137" font-size="11" fill="#5a6b85" text-anchor="middle">· 下载差分包</text>
  <text x="552" y="161" font-size="11" fill="#5a6b85" text-anchor="middle">· 静默安装</text>
  <text x="552" y="185" font-size="11" fill="#e0913f" text-anchor="middle">· 失败 → 回滚旧版</text>

  <!-- 连线 -->
  <line x1="190" y1="150" x2="240" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="425" y1="150" x2="470" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="500" y1="225" x2="110" y2="210" stroke="#e0913f" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- 底部运营 -->
  <rect x="40" y="300" width="180" height="34" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="130" y="322" font-size="12" fill="#2f6b3d" text-anchor="middle">运营指标（激活/在线）</text>

  <rect x="250" y="300" width="180" height="34" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
  <text x="340" y="322" font-size="12" fill="#8a5a1f" text-anchor="middle">升级成功率监控</text>

  <rect x="460" y="300" width="180" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="550" y="322" font-size="12" fill="#4d3a82" text-anchor="middle">批量指令（可撤销）</text>

  <line x1="332" y1="235" x2="130" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="332" y1="235" x2="340" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="332" y1="235" x2="550" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以米家/MiOT 官方文档为准。</text>
</svg>
