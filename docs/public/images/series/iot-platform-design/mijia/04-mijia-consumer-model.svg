<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">米家物模型与家庭场景建模（MIoT-Spec · 状态同步 · 层级）</text>

  <!-- 物模型 -->
  <rect x="30" y="90" width="150" height="135" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="105" y="115" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">MIoT-Spec 物模型</text>
  <text x="105" y="142" font-size="11" fill="#5a6b85" text-anchor="middle">· 属性（状态）</text>
  <text x="105" y="166" font-size="11" fill="#5a6b85" text-anchor="middle">· 事件（上报）</text>
  <text x="105" y="190" font-size="11" fill="#5a6b85" text-anchor="middle">· 服务（指令）</text>
  <text x="105" y="214" font-size="11" fill="#27496d" text-anchor="middle">统一抽象硬件</text>

  <!-- 设备影子 -->
  <rect x="235" y="95" width="170" height="120" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="320" y="120" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">设备状态同步</text>
  <text x="320" y="147" font-size="11" fill="#5a6b85" text-anchor="middle">· reported 实际状态</text>
  <text x="320" y="171" font-size="11" fill="#5a6b85" text-anchor="middle">· desired 期望状态</text>
  <text x="320" y="195" font-size="11" fill="#5a6b85" text-anchor="middle">· 弱网下保状态</text>

  <!-- 家庭层级 -->
  <rect x="470" y="55" width="180" height="160" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="560" y="78" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">家庭（根）</text>
  <text x="560" y="102" font-size="11" fill="#5a6b85" text-anchor="middle">├ 客厅（房间）</text>
  <text x="560" y="124" font-size="11" fill="#5a6b85" text-anchor="middle">│  ├ 灯 / 窗帘</text>
  <text x="560" y="146" font-size="11" fill="#5a6b85" text-anchor="middle">│  └ 观影场景</text>
  <text x="560" y="170" font-size="11" fill="#5a6b85" text-anchor="middle">└ 卧室（房间）</text>
  <text x="560" y="192" font-size="11" fill="#5a6b85" text-anchor="middle">   └ 空调</text>

  <!-- 语音联动 -->
  <rect x="470" y="225" width="180" height="72" rx="8" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="560" y="250" font-size="13" font-weight="700" fill="#4d3a82" text-anchor="middle">小爱同学</text>
  <text x="560" y="274" font-size="11" fill="#4d3a82" text-anchor="middle">NL「打开客厅灯」</text>
  <text x="560" y="294" font-size="11" fill="#4d3a82" text-anchor="middle">解析为属性写操作</text>

  <!-- 连线 -->
  <line x1="180" y1="155" x2="235" y2="155" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="405" y1="130" x2="470" y2="110" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="405" y1="175" x2="470" y2="250" stroke="#c9b3e8" stroke-width="1.6"/>

  <!-- 底部能力 -->
  <rect x="40" y="300" width="180" height="34" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="130" y="322" font-size="12" fill="#2f6b3d" text-anchor="middle">多端状态一致</text>

  <rect x="250" y="300" width="180" height="34" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
  <text x="340" y="322" font-size="12" fill="#8a5a1f" text-anchor="middle">离线可达（影子兜底）</text>

  <rect x="460" y="300" width="180" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="550" y="322" font-size="12" fill="#4d3a82" text-anchor="middle">场景编排（一键触发）</text>

  <line x1="320" y1="215" x2="130" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="320" y1="215" x2="340" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>
  <line x1="320" y1="215" x2="550" y2="300" stroke="#9bb4dd" stroke-width="1.5"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以米家/MiOT 官方文档为准。</text>
</svg>
