<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">小米米家（MiOT）总体架构（碎片设备 → MiOT 平台 → 米家App/小爱）</text>

  <!-- 高碎片化端侧 -->
  <rect x="30" y="60" width="150" height="160" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="105" y="85" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">碎片化米家设备</text>
  <text x="105" y="112" font-size="11" fill="#5a6b85" text-anchor="middle">灯泡 · 插座</text>
  <text x="105" y="132" font-size="11" fill="#5a6b85" text-anchor="middle">门锁 · 摄像头</text>
  <text x="105" y="152" font-size="11" fill="#5a6b85" text-anchor="middle">扫地机 · 传感器</text>
  <text x="105" y="180" font-size="11" fill="#5a6b85" text-anchor="middle">协议：Wi-Fi / BLE</text>
  <text x="105" y="198" font-size="11" fill="#5a6b85" text-anchor="middle">Zigbee / Thread</text>

  <!-- 统一平台层 -->
  <rect x="245" y="80" width="180" height="190" rx="10" fill="#ffffff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="335" y="108" font-size="15" font-weight="700" fill="#1f3a5f" text-anchor="middle">MiOT 平台层</text>
  <text x="335" y="135" font-size="11" fill="#5a6b85" text-anchor="middle">· 连接（配网 / 保活）</text>
  <text x="335" y="160" font-size="11" fill="#5a6b85" text-anchor="middle">· 消息（事件 / 规则）</text>
  <text x="335" y="185" font-size="11" fill="#5a6b85" text-anchor="middle">· 物模型（MIoT-Spec）</text>
  <text x="335" y="210" font-size="11" fill="#5a6b85" text-anchor="middle">· 设备管理（OTA）</text>
  <text x="335" y="240" font-size="11" fill="#27496d" text-anchor="middle">收敛异构端为干净数据</text>

  <!-- 用户侧 -->
  <rect x="500" y="110" width="150" height="130" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="575" y="138" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">用户侧</text>
  <text x="575" y="165" font-size="11" fill="#5a6b85" text-anchor="middle">米家 App 操控</text>
  <text x="575" y="188" font-size="11" fill="#5a6b85" text-anchor="middle">小爱同学联动</text>
  <text x="575" y="211" font-size="11" fill="#5a6b85" text-anchor="middle">家庭 / 房间 / 场景</text>

  <!-- 连线 端侧->平台 -->
  <line x1="180" y1="110" x2="245" y2="130" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="180" y1="170" x2="245" y2="180" stroke="#9bb4dd" stroke-width="2"/>
  <!-- 平台->用户侧 -->
  <line x1="425" y1="140" x2="500" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="425" y1="195" x2="500" y2="185" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 横向支撑服务 -->
  <rect x="40" y="305" width="180" height="34" rx="6" fill="#fff4ec" stroke="#e0913f" stroke-width="1.5"/>
  <text x="130" y="327" font-size="12" fill="#8a5a1f" text-anchor="middle">配网激活（扫码/蓝牙辅助）</text>

  <rect x="250" y="305" width="180" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="340" y="327" font-size="12" fill="#4d3a82" text-anchor="middle">隐私安全（个保法红线）</text>

  <rect x="460" y="305" width="180" height="34" rx="6" fill="#eef7ee" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="550" y="327" font-size="12" fill="#2f6b3d" text-anchor="middle">OTA 运营（自愈与升级）</text>

  <!-- 平台->支撑 -->
  <line x1="335" y1="270" x2="130" y2="305" stroke="#c9b3e8" stroke-width="1.5"/>
  <line x1="335" y1="270" x2="340" y2="305" stroke="#c9b3e8" stroke-width="1.5"/>
  <line x1="335" y1="270" x2="550" y2="305" stroke="#c9b3e8" stroke-width="1.5"/>

  <text x="340" y="400" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以米家/MiOT 官方文档为准。</text>
</svg>
