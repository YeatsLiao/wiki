<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1f2937">设备智能化：端-边-网-云 四步链路</text>

  <rect x="20" y="70" width="120" height="60" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="80" y="98" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">端</text>
  <text x="80" y="116" font-size="11" fill="#334155" text-anchor="middle">设备采集</text>

  <rect x="180" y="70" width="120" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="98" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">边</text>
  <text x="240" y="116" font-size="11" fill="#334155" text-anchor="middle">协议转换</text>

  <rect x="340" y="70" width="120" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="400" y="98" font-size="16" font-weight="700" fill="#713f12" text-anchor="middle">网</text>
  <text x="400" y="116" font-size="11" fill="#334155" text-anchor="middle">网络传输</text>

  <rect x="500" y="70" width="150" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="575" y="98" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">云</text>
  <text x="575" y="116" font-size="11" fill="#334155" text-anchor="middle">平台接入</text>

  <line x1="140" y1="100" x2="176" y2="100" stroke="#64748b" stroke-width="2"/>
  <polygon points="176,94 176,106 186,100" fill="#64748b"/>
  <line x1="300" y1="100" x2="336" y2="100" stroke="#64748b" stroke-width="2"/>
  <polygon points="336,94 336,106 346,100" fill="#64748b"/>
  <line x1="460" y1="100" x2="496" y2="100" stroke="#64748b" stroke-width="2"/>
  <polygon points="496,94 496,106 506,100" fill="#64748b"/>

  <rect x="60" y="180" width="560" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="206" font-size="14" font-weight="700" fill="#1f2937">物联网平台（业务上云的基础设施）</text>
  <rect x="84" y="220" width="160" height="44" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="164" y="247" font-size="13" fill="#0c4a6e" text-anchor="middle">设备连接</text>
  <rect x="260" y="220" width="160" height="44" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="247" font-size="13" fill="#14532d" text-anchor="middle">设备管理</text>
  <rect x="436" y="220" width="160" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="516" y="247" font-size="13" fill="#4c1d95" text-anchor="middle">数据分析</text>

  <text x="340" y="318" font-size="13" fill="#475569" text-anchor="middle">↑ 平台包揽底层，客户聚焦核心业务（如光伏监控应用）</text>
</svg>
