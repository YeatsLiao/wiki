<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="450" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">MindSphere 总体架构（OT 现场 → MindConnect 边缘 → 云端核心 → MindApps）</text>

  <!-- OT 现场 -->
  <rect x="30" y="55" width="190" height="305" rx="10" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="125" y="78" font-size="14" font-weight="700" fill="#b9702a" text-anchor="middle">OT 现场（车间 / 设备）</text>
  <rect x="50" y="95" width="150" height="40" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="125" y="120" font-size="12" fill="#5a6b85" text-anchor="middle">传感器 / 执行器</text>
  <rect x="50" y="143" width="150" height="40" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="125" y="168" font-size="12" fill="#5a6b85" text-anchor="middle">PLC / DCS</text>
  <rect x="50" y="191" width="150" height="40" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="125" y="216" font-size="12" fill="#5a6b85" text-anchor="middle">SCADA / HMI</text>
  <rect x="50" y="239" width="150" height="40" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="125" y="264" font-size="12" fill="#5a6b85" text-anchor="middle">老旧专用设备</text>
  <text x="125" y="312" font-size="11" fill="#b9702a" text-anchor="middle">协议碎片化 · 长生命周期</text>

  <!-- MindSphere 平台 -->
  <rect x="245" y="55" width="190" height="305" rx="10" fill="#eef4ff" stroke="#3f6fd1" stroke-width="2.5"/>
  <text x="340" y="78" font-size="14" font-weight="700" fill="#27496d" text-anchor="middle">MindSphere（云端核心）</text>
  <rect x="265" y="95" width="150" height="40" rx="6" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="120" font-size="12" fill="#5a6b85" text-anchor="middle">MindConnect（边缘接入）</text>
  <rect x="265" y="143" width="150" height="40" rx="6" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="168" font-size="12" fill="#5a6b85" text-anchor="middle">Ingestion Service</text>
  <rect x="265" y="191" width="150" height="40" rx="6" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="216" font-size="12" fill="#5a6b85" text-anchor="middle">Time Series Service</text>
  <rect x="265" y="239" width="150" height="40" rx="6" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="264" font-size="12" fill="#5a6b85" text-anchor="middle">Asset Management</text>
  <rect x="265" y="287" width="150" height="40" rx="6" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="312" font-size="12" fill="#5a6b85" text-anchor="middle">Analytics</text>
  <text x="340" y="332" font-size="11" fill="#27496d" text-anchor="middle">统一抽象 · 安全合规</text>

  <!-- MindApps / IT 业务 -->
  <rect x="460" y="55" width="190" height="305" rx="10" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="555" y="78" font-size="14" font-weight="700" fill="#3a7a4a" text-anchor="middle">MindApps / IT 业务</text>
  <rect x="480" y="95" width="150" height="40" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="555" y="120" font-size="12" fill="#5a6b85" text-anchor="middle">Analyze MyMachine</text>
  <rect x="480" y="143" width="150" height="40" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="555" y="168" font-size="12" fill="#5a6b85" text-anchor="middle">Visualizer</text>
  <rect x="480" y="191" width="150" height="40" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="555" y="216" font-size="12" fill="#5a6b85" text-anchor="middle">MES / ERP</text>
  <rect x="480" y="239" width="150" height="40" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="555" y="264" font-size="12" fill="#5a6b85" text-anchor="middle">预测性维护 / AI</text>
  <text x="555" y="312" font-size="11" fill="#3a7a4a" text-anchor="middle">数据驱动决策</text>

  <!-- 连接线 -->
  <line x1="220" y1="115" x2="245" y2="115" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="220" y1="163" x2="245" y2="163" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="220" y1="211" x2="245" y2="211" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="220" y1="259" x2="245" y2="259" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="435" y1="115" x2="460" y2="115" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="435" y1="163" x2="460" y2="163" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="435" y1="211" x2="460" y2="211" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="435" y1="259" x2="460" y2="259" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 底部约束带 -->
  <rect x="30" y="372" width="620" height="52" rx="8" fill="#ffffff" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="340" y="393" font-size="12" font-weight="700" fill="#5a4a8a" text-anchor="middle">工业特有约束：协议碎片化（S7 / Modbus / OPC UA / Profinet）· 设备长生命周期（10~20 年）· 强实时高可靠</text>
  <text x="340" y="413" font-size="12" font-weight="700" fill="#5a4a8a" text-anchor="middle">安全合规：端到端加密 · RBAC · 租户隔离 · IEC 62443 · 等保 · GDPR</text>

  <text x="340" y="438" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以 MindSphere 官方文档为准。</text>
</svg>
