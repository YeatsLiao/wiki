<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="440" fill="#f7f9fc"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">海量设备管理：Fleet Manager 跨厂区跨协议纳管</text>

  <!-- 厂区 A -->
  <rect x="30" y="55" width="150" height="200" rx="10" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="105" y="78" font-size="13" font-weight="700" fill="#b9702a" text-anchor="middle">厂区 A</text>
  <rect x="46" y="95" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="105" y="119" font-size="11" fill="#5a6b85" text-anchor="middle">Modbus</text>
  <rect x="46" y="145" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="105" y="169" font-size="11" fill="#5a6b85" text-anchor="middle">OPC UA</text>
  <rect x="46" y="195" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="105" y="219" font-size="11" fill="#5a6b85" text-anchor="middle">PLC</text>

  <!-- 厂区 B -->
  <rect x="200" y="55" width="150" height="200" rx="10" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="275" y="78" font-size="13" font-weight="700" fill="#b9702a" text-anchor="middle">厂区 B</text>
  <rect x="216" y="95" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="275" y="119" font-size="11" fill="#5a6b85" text-anchor="middle">S7</text>
  <rect x="216" y="145" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="275" y="169" font-size="11" fill="#5a6b85" text-anchor="middle">Profinet</text>
  <rect x="216" y="195" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="275" y="219" font-size="11" fill="#5a6b85" text-anchor="middle">MindConnect</text>

  <!-- 厂区 C -->
  <rect x="370" y="55" width="150" height="200" rx="10" fill="#fff4ec" stroke="#e0913f" stroke-width="2"/>
  <text x="445" y="78" font-size="13" font-weight="700" fill="#b9702a" text-anchor="middle">厂区 C</text>
  <rect x="386" y="95" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="445" y="119" font-size="11" fill="#5a6b85" text-anchor="middle">老旧专机</text>
  <rect x="386" y="145" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="445" y="169" font-size="11" fill="#5a6b85" text-anchor="middle">工业以太网</text>
  <rect x="386" y="195" width="118" height="38" rx="6" fill="#ffffff" stroke="#e0913f" stroke-width="1.5"/>
  <text x="445" y="219" font-size="11" fill="#5a6b85" text-anchor="middle">仪表</text>

  <!-- MindSphere 统一纳管 -->
  <rect x="535" y="55" width="135" height="280" rx="10" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="602" y="78" font-size="13" font-weight="700" fill="#3a7a4a" text-anchor="middle">MindSphere 纳管</text>
  <rect x="549" y="92" width="107" height="34" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="602" y="113" font-size="11" fill="#5a6b85" text-anchor="middle">Fleet Manager</text>
  <rect x="549" y="132" width="107" height="34" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="602" y="153" font-size="11" fill="#5a6b85" text-anchor="middle">Agent Management</text>
  <rect x="549" y="172" width="107" height="34" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="602" y="193" font-size="11" fill="#5a6b85" text-anchor="middle">Device Configuration</text>
  <rect x="549" y="212" width="107" height="34" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="602" y="233" font-size="11" fill="#5a6b85" text-anchor="middle">Firmware Deployment</text>
  <rect x="549" y="252" width="107" height="34" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
  <text x="602" y="273" font-size="11" fill="#5a6b85" text-anchor="middle">远程运维</text>
  <rect x="549" y="292" width="107" height="30" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="602" y="311" font-size="11" fill="#5a6b85" text-anchor="middle">检索 / 分组</text>

  <!-- 连线 -->
  <line x1="180" y1="150" x2="535" y2="150" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="350" y1="150" x2="535" y2="160" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="520" y1="150" x2="535" y2="170" stroke="#9bb4dd" stroke-width="2"/>

  <!-- 设备生命周期 -->
  <rect x="30" y="290" width="480" height="60" rx="8" fill="#eef4ff" stroke="#3f6fd1" stroke-width="1.5"/>
  <text x="80" y="320" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">装机</text>
  <text x="195" y="320" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">运行</text>
  <text x="315" y="320" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">维护</text>
  <text x="430" y="320" font-size="13" font-weight="700" fill="#27496d" text-anchor="middle">退役</text>
  <line x1="115" y1="315" x2="155" y2="315" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="235" y1="315" x2="275" y2="315" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="355" y1="315" x2="395" y2="315" stroke="#9bb4dd" stroke-width="2"/>
  <text x="270" y="343" font-size="11" fill="#5a6b85" text-anchor="middle">设备全生命周期：注册 → 配置 → 运维 → 退役</text>

  <text x="340" y="420" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以 MindSphere 官方文档为准。</text>
</svg>
