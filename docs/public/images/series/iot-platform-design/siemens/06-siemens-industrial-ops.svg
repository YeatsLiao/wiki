  <rect x="483" y="215" width="150" height="44" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="558" y="242" font-size="12" fill="#5a6b85" text-anchor="middle">IEC 62443</text>
