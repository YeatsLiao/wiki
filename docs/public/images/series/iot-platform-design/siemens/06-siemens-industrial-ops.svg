  <!-- 合规与功能安全 -->
  <rect x="465" y="55" width="185" height="320" rx="10" fill="#eef7ee" stroke="#5aa86a" stroke-width="2"/>
  <text x="557" y="78" font-size="14" font-weight="700" fill="#3a7a4a" text-anchor="middle">合规与功能安全</text>
  <rect x="483" y="95" width="150" height="44" rx="6" fill="#ffffff" stroke="#5aa86a" stroke-width="1.5"/>
  <text x="558" y="122" font-size="12" fill="#5a6b85" text-anchor="middle">端到端加密 / 证书</text>
  <rect x="483" y="155" width="150" height="44" rx="6" fill="#f0ecfb" stroke="#8a6fd0" stroke-width="1.5"/>
