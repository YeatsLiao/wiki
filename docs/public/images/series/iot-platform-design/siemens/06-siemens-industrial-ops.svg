  <text x="558" y="302" font-size="12" fill="#5a6b85" text-anchor="middle">等保 / GDPR</text>
  <text x="558" y="352" font-size="11" fill="#3a7a4a" text-anchor="middle">安全 · 合规 · 可信</text>

  <!-- 连线 -->
  <line x1="215" y1="200" x2="247" y2="200" stroke="#9bb4dd" stroke-width="2"/>
  <line x1="433" y1="200" x2="465" y2="200" stroke="#9bb4dd" stroke-width="2"/>
  <text x="231" y="190" font-size="10" fill="#8a97ad" text-anchor="middle">自愈</text>
  <text x="449" y="190" font-size="10" fill="#8a97ad" text-anchor="middle">联动</text>

  <text x="340" y="412" font-size="11" fill="#8a97ad" text-anchor="middle">说明：本图为手绘示意，未使用官方版权图；精确服务边界以 MindSphere 官方文档为准。</text>
