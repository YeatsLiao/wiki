<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="460" fill="#f7f8fa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">智慧农业监测闭环：把前面所有设计理念串起来</text>

  <!-- 南向：现场 -->
  <rect x="20" y="50" width="640" height="95" rx="10" fill="#eef4ff" stroke="#4285f4" stroke-width="1.2"/>
  <text x="40" y="70" font-size="12" font-weight="700" fill="#4285f4">① 现场（南向接入）</text>
  <g font-size="11" fill="#1f2328">
    <rect x="40" y="80" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
    <text x="95" y="100" text-anchor="middle">子设备 S1</text>
    <text x="95" y="118" text-anchor="middle" font-size="9" fill="#5f6368">土壤·LoRa</text>
    <rect x="160" y="80" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
    <text x="215" y="100" text-anchor="middle">子设备 S2</text>
    <text x="215" y="118" text-anchor="middle" font-size="9" fill="#5f6368">土壤·LoRa</text>
    <rect x="280" y="80" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
    <text x="335" y="100" text-anchor="middle">子设备 S3</text>
    <text x="335" y="118" text-anchor="middle" font-size="9" fill="#5f6368">气象·LoRa</text>
    <rect x="470" y="80" width="160" height="50" rx="8" fill="#fff3e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="550" y="100" text-anchor="middle" font-weight="700">网关 GW</text>
    <text x="550" y="118" text-anchor="middle" font-size="9" fill="#5f6368">4G 直连平台</text>
  </g>
  <g stroke="#f9ab00" stroke-width="1.5" fill="none">
    <path d="M95 130 C 200 150, 400 150, 470 130" marker-end="url(#o)"/>
    <path d="M215 130 C 300 155, 420 150, 470 130" marker-end="url(#o)"/>
    <path d="M335 130 C 400 158, 450 150, 470 130" marker-end="url(#o)"/>
  </g>

  <!-- 平台 -->
  <rect x="20" y="170" width="640" height="130" rx="10" fill="#eafaf0" stroke="#34a853" stroke-width="1.2"/>
  <text x="40" y="190" font-size="12" font-weight="700" fill="#34a853">② 物联网平台（连接抽象 · 数据标准化 · 规则解耦）</text>
  <g font-size="11" fill="#1f2328">
    <rect x="40" y="205" width="180" height="78" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="130" y="228" text-anchor="middle" font-weight="700">产品 / 物模型</text>
    <text x="130" y="248" text-anchor="middle" font-size="10" fill="#5f6368">土壤传感器产品</text>
    <text x="130" y="264" text-anchor="middle" font-size="10" fill="#5f6368">属性: 湿度/温度</text>

    <rect x="250" y="205" width="160" height="78" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="330" y="228" text-anchor="middle" font-weight="700">设备影子</text>
    <text x="330" y="248" text-anchor="middle" font-size="10" fill="#5f6368">desired / reported</text>
    <text x="330" y="264" text-anchor="middle" font-size="10" fill="#5f6368">离线指令不丢</text>

    <rect x="440" y="205" width="200" height="78" rx="8" fill="#ffffff" stroke="#34a853"/>
    <text x="540" y="228" text-anchor="middle" font-weight="700">规则引擎</text>
    <text x="540" y="248" text-anchor="middle" font-size="10" fill="#5f6368">IF 湿度&lt;30 THEN 联动</text>
    <text x="540" y="264" text-anchor="middle" font-size="10" fill="#5f6368">转发看板 / 告警</text>
  </g>

  <!-- 北向 -->
  <rect x="20" y="320" width="640" height="100" rx="10" fill="#fdeef0" stroke="#ea4335" stroke-width="1.2"/>
  <text x="40" y="340" font-size="12" font-weight="700" fill="#ea4335">③ 北向应用（业务消费）</text>
  <g font-size="11" fill="#1f2328">
    <rect x="40" y="350" width="180" height="55" rx="8" fill="#ffffff" stroke="#ea4335"/>
    <text x="130" y="372" text-anchor="middle" font-weight="700">可视化看板</text>
    <text x="130" y="390" text-anchor="middle" font-size="10" fill="#5f6368">实时墒情 / 趋势</text>
    <rect x="250" y="350" width="180" height="55" rx="8" fill="#ffffff" stroke="#ea4335"/>
    <text x="340" y="372" text-anchor="middle" font-weight="700">告警通知</text>
    <text x="340" y="390" text-anchor="middle" font-size="10" fill="#5f6368">短信 / 钉钉</text>
    <rect x="440" y="350" width="200" height="55" rx="8" fill="#ffffff" stroke="#ea4335"/>
    <text x="540" y="372" text-anchor="middle" font-weight="700">联动控制</text>
    <text x="540" y="390" text-anchor="middle" font-size="10" fill="#5f6368">自动灌溉 / 通风</text>
  </g>

  <!-- 纵向连线 -->
  <g stroke="#34a853" stroke-width="2" fill="none">
    <path d="M550 130 C 550 150, 550 155, 550 170" marker-end="url(#g)"/>
  </g>
  <text x="600" y="155" font-size="9" fill="#5f6368">直连</text>
  <g stroke="#ea4335" stroke-width="1.8" stroke-dasharray="6 4" fill="none">
    <path d="M130 283 C 130 300, 130 305, 130 320" marker-end="url(#r)"/>
    <path d="M330 283 C 330 300, 340 305, 340 320" marker-end="url(#r)"/>
    <path d="M540 283 C 540 300, 540 305, 540 320" marker-end="url(#r)"/>
  </g>

  <text x="340" y="448" text-anchor="middle" font-size="11" fill="#5f6368">子设备→网关→平台→北向：连接抽象 + 物模型 + 影子 + 规则，一气呵成</text>

  <defs>
    <marker id="o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f9ab00"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#34a853"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ea4335"/></marker>
  </defs>
</svg>
